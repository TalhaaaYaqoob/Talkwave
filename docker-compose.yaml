services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Bind to localhost only; never expose the database on 0.0.0.0.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    ports:
      # Bind to localhost only; never expose Redis on 0.0.0.0.
      - "127.0.0.1:6379:6379"
    command: >
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in your .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your .env}"
      # Do not allow arbitrary cross-origin access to object storage.
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3010}"
    ports:
      - "127.0.0.1:9000:9000" # Bind to localhost explicitly
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_https
    profiles: ["remote"]
    depends_on:
      - ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - app-network

  api:
    build:
      context: ./api/talkwave-backend
    image: ${REGISTRY:-talkwave}/talkwave-api:latest
    volumes:
      - shared-tmp:/tmp
    # Provider keys (Clerk, LLM/STT/TTS, telephony) live in the backend .env.
    # Values under `environment:` below take precedence over this file.
    env_file:
      - path: ./api/talkwave-backend/.env
        required: false
    environment:
      # Core application config
      ENVIRONMENT: "local"
      LOG_LEVEL: "INFO"
      UI_APP_URL: "${UI_APP_URL:-http://localhost:3010}"

      # Database configuration (using containerized postgres)
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}"

      # Redis configuration (using containerized redis)
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"

      # Storage configuration - using local MinIO
      ENABLE_AWS_S3: "false"

      # MinIO
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # Langfuse
      ENABLE_TRACING: "false"
      # LANGFUSE_SECRET_KEY: ""
      # LANGFUSE_PUBLIC_KEY: ""
      # LANGFUSE_HOST: "https://cloud.langfuse.com"

      # Sentry (telemetry off by default; provide DSN via .env to enable)
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-false}"
      SENTRY_DSN: "${API_SENTRY_DSN:-}"

      # TURN server configuration (for WebRTC NAT traversal in remote server)
      TURN_HOST: "${TURN_HOST:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_PASSWORD: "${TURN_PASSWORD:-}"

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_PROVIDER: "${NEXT_PUBLIC_AUTH_PROVIDER:-clerk}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
    image: ${REGISTRY:-talkwave}/talkwave-ui:latest
    environment:
      # Server-side URL (SSR, internal Docker network)
      BACKEND_URL: "http://api:8000"
      NODE_ENV: "production"

      # Flag to enable/ disable posthog and sentry
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-false}"

      # Posthog (provide via .env to enable)
      POSTHOG_KEY: "${POSTHOG_KEY:-}"
      POSTHOG_HOST: "${POSTHOG_HOST:-https://us.posthog.com}"

      # Sentry (provide via .env to enable)
      SENTRY_DSN: "${UI_SENTRY_DSN:-}"

      # TURN server configuration (for WebRTC NAT traversal in remote server)
      # Fetched at runtime via /api/config/turn endpoint
      TURN_HOST: "${TURN_HOST:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_PASSWORD: "${TURN_PASSWORD:-}"
    ports:
      - "3010:3010"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3010 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # Optional public tunnel. Disabled by default (opt in with the "remote"
  # profile). An ephemeral --url tunnel exposes the entire API to the internet
  # with no access policy; production should use a named tunnel with Cloudflare
  # Access in front of it. Metrics are bound to localhost only.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    profiles: ["remote"]
    command: tunnel --no-autoupdate --url http://api:8000 --metrics 127.0.0.1:2000
    networks:
      - app-network

  coturn:
    image: coturn/coturn:4.6.3
    container_name: coturn
    restart: unless-stopped
    profiles: ["remote"]
    network_mode: host
    environment:
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
    command: >
      -n
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=49200
      --realm=${TURN_REALM:-localhost}
      --user=${TURN_USERNAME}:${TURN_PASSWORD}
      --lt-cred-mech
      --fingerprint
      --no-cli
      --log-file=stdout
      --no-multicast-peers
      --no-tlsv1
      --no-tlsv1_1
      ${TURN_HOST:+--external-ip=$TURN_HOST}

volumes:
  postgres_data:
  redis_data:
  minio-data:
    driver: local
  shared-tmp:
    driver: local

networks:
  app-network:
    driver: bridge
