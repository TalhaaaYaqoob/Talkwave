name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/talkwave-backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talkwave_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talkwave_test
      REDIS_URL: redis://localhost:6379
      ENABLE_TELEMETRY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/talkwave-backend/requirements.txt
            api/talkwave-backend/requirements.dev.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements.dev.txt

      # The backend is imported as the `api` package and Pipecat is vendored.
      - name: Configure import path
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          ln -s "$GITHUB_WORKSPACE/api/talkwave-backend" "$RUNNER_TEMP/pkg/api"
          echo "PYTHONPATH=$RUNNER_TEMP/pkg:$GITHUB_WORKSPACE/api/talkwave-backend/pipecat/src" >> "$GITHUB_ENV"

      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --exclude pipecat .

      - name: Database migrations
        run: alembic upgrade heads

      - name: Pytest
        run: pytest tests -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_AUTH_PROVIDER: clerk
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: talkwave-api
            context: api/talkwave-backend
            dockerfile: api/talkwave-backend/Dockerfile
          - image: talkwave-ui
            context: .
            dockerfile: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
